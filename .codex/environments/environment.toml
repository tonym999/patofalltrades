version = 1
name = "patofalltrades"

[setup]
script = ""

[setup.linux]
script = '''
set -e

# Keep worktree setup caches on the Linux filesystem.
export TMPDIR=/tmp
export TMP=/tmp
export TEMP=/tmp
export XDG_CACHE_HOME=/tmp/codex-cache
export COREPACK_HOME=/tmp/corepack
mkdir -p "$XDG_CACHE_HOME" "$COREPACK_HOME"

export NVM_DIR="$HOME/.nvm"
[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

cd "$CODEX_WORKTREE_PATH"
nvm use --silent
cd web
pnpm install
'''
